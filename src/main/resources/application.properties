server.port=8080
spring.application.name=client.api
spring.datasource.url=jdbc:mysql://localhost:3306/utn
spring.datasource.username=root
spring.datasource.password=Hoth1977*
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# AGREGAR UNA VARIABLE PARA LA CANTIDAD DE DIAS EN LA FUNCION DE CLIENT
app.clientes.diasumbral=3
dolar.api.url=https://dolarapi.com/v1
card.api.url=https://localhost:8081

# CONFIGURACION DE EUREKA CLIENT
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

eureka.instance.prefer-ip-address=true
eureka.instance.lease-renewal-interval-in-seconds=30
eureka.instance.lease-expiration-duration-in-seconds=90

# CONFIGURACION DE CONFIG SERVER
spring.config.import=optional:configserver:http://localhost:8888